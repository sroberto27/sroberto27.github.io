<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>360 Pose Refinement Lab</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f25; --panel2: #22262e; --line: #2e333c;
    --ink: #e6e8ec; --muted: #939aa6; --accent: #f5a623; --ok: #4ec9a0; --bad: #e2626b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 13px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0; font-weight: 650; }
  h1 span { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: 12px; }
  .wrap { padding: 16px 18px; max-width: 1500px; }
  .row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px 16px; margin-bottom: 16px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  button { background: var(--accent); color: #221703; border: 0; border-radius: 6px;
    padding: 8px 14px; font-weight: 600; font-size: 13px; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  select, input { background: var(--panel2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 9px; font-size: 13px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums;
    font-family: ui-monospace, Consolas, monospace; }
  .metric { display: flex; justify-content: space-between; gap: 20px; padding: 5px 0;
    border-bottom: 1px solid var(--line); }
  .metric b { font-family: ui-monospace, Consolas, monospace; font-weight: 600; }
  .good { color: var(--ok); } .bad { color: var(--bad); } .dim { color: var(--muted); }
  #log { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px;
    white-space: pre-wrap; max-height: 260px; overflow: auto; color: var(--muted); margin: 0; }
  .bar { height: 5px; background: var(--panel2); border-radius: 3px; overflow: hidden; margin: 8px 0; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  canvas { max-width: 100%; border: 1px solid var(--line); border-radius: 6px; display: block; }
  .col { flex: 1 1 340px; min-width: 320px; }
  .note { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
  code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>360 Pose Refinement Lab <span>XFeat + spherical bundle adjustment</span></h1>
  <span id="ortStatus" class="dim">runtime: not loaded</span>
</header>

<div class="wrap">
  <div class="card">
    <h2>1 &middot; Capture session</h2>
    <div class="row" style="align-items:center">
      <select id="sessionSel" style="min-width:340px"><option>Scanning IndexedDB…</option></select>
      <button id="reloadBtn" class="ghost">Rescan</button>
      <button id="runBtn" disabled>Run refinement</button>
      <label class="dim">max side
        <select id="maxSide">
          <option value="512">512</option>
          <option value="640" selected>640</option>
          <option value="800">800</option>
          <option value="1024">1024</option>
        </select>
      </label>
      <label class="dim"><input type="checkbox" id="gated" checked> prior-gated matching</label>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <p class="note" id="sessionNote">Reads the app's own IndexedDB (<code>lsc2_media</code>) directly &mdash; same origin, nothing in the app is modified.</p>
  </div>

  <div class="row">
    <div class="col">
      <div class="card">
        <h2>2 &middot; Results</h2>
        <div id="results"><p class="note">Run a session to see metrics.</p></div>
      </div>
      <div class="card">
        <h2>Per-view correction</h2>
        <div style="max-height:300px;overflow:auto"><table id="viewTable"><tbody></tbody></table></div>
      </div>
    </div>
    <div class="col" style="flex:2 1 620px">
      <div class="card">
        <h2>3 &middot; Match inspector</h2>
        <div class="row" style="align-items:center;margin-bottom:10px">
          <select id="pairSel" style="min-width:280px"><option>—</option></select>
          <label class="dim"><input type="checkbox" id="showOutliers"> show rejected</label>
        </div>
        <canvas id="pairCanvas" width="1200" height="360"></canvas>
        <p class="note" id="pairNote"></p>
      </div>
      <div class="card">
        <h2>Log</h2>
        <pre id="log"></pre>
      </div>
    </div>
  </div>
</div>

<script type="module" src="lab-boot.js"></script>
<script src="../pano/so3.js"></script>
<script src="../pano/camera.js"></script>
<script src="../pano/estimate.js"></script>
<script src="../pano/calibrate.js"></script>
<script src="../pano/bundle.js"></script>
<script src="../pano/pipeline.js"></script>
<script src="../pano/xfeat-extractor.js"></script>
<script src="../pano/xfeat-match.js"></script>
<script src="lab.js"></script>
</body>
</html>
