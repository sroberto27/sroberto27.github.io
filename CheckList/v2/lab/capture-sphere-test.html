<!DOCTYPE html>
<!-- Readback regression test for capture-sphere.js, the live 3D preview
     drawn over the camera during a 360 capture.

     Everything this file checks is a mistake that is invisible in code
     review and obvious on a phone, which is why it reads pixels back
     rather than asserting on numbers:

       - a patch drawn at the wrong POSE. Four patches are placed at known
         yaw/pitch in four flat colours; pointing the preview at each one
         in turn must show that colour and no other. A sign error in the
         view matrix, or capture's z-up convention leaking into GL's
         y-up, moves a patch somewhere plausible-looking, and only a
         readback notices.
       - a patch drawn UPSIDE DOWN. This is the same class of bug
         panorama-viewer.js shipped with UNPACK_FLIP_Y_WEBGL, and the same
         reasoning applies here (texture coordinates are computed in
         patchMesh(), not inherited from quad UVs, so there is no
         convention for a flip to cancel against). A fifth patch is
         half red on top and half blue on the bottom, and the test reads
         the top and bottom of the screen separately.
       - a patch drawn BEHIND the camera leaking into view. The near-plane
         clip is the only thing preventing it, and there is no depth
         buffer to catch it if that goes wrong.
       - removePatch() leaving the removed patch on screen, which is what
         Retake depends on.

     Runs the REAL, unmodified capture-sphere.js. Needs no camera, no
     capture session and no phone. Drive it with headless Chrome the same
     way as lab/viewer-flip-test.html; it reports into #result and sets
     window.__done when finished. -->
<html><head><meta charset="utf-8"><title>capture sphere regression test</title>
<style>
  body { margin: 0; background: #000; color: #ddd; font: 13px/1.5 ui-monospace, Consolas, monospace; }
  #stage { position: fixed; inset: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #result { position: fixed; z-index: 9; left: 0; right: 0; bottom: 0; background: #111;
    padding: 8px 12px; white-space: pre-wrap; max-height: 55vh; overflow: auto; }
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas></div>
<pre id="result">PENDING</pre>
<script>
  /* Test-harness-only, exactly as in lab/viewer-flip-test.html:
     capture-sphere.js correctly omits preserveDrawingBuffer (it costs
     performance and changes nothing on screen, because the compositor
     keeps showing the last drawn frame). But an external readback can
     legitimately see a cleared buffer without it. Injected here, and only
     here, so the test can read the real module's output. */
  const _origGetContext = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function (type, opts) {
    if (type === 'webgl' || type === 'experimental-webgl') {
      opts = Object.assign({}, opts, { preserveDrawingBuffer: true });
    }
    return _origGetContext.call(this, type, opts);
  };
</script>
<script src="../capture-sphere.js"></script>
<script>
(function () {
  const DEG = Math.PI / 180;
  const out = document.getElementById('result');
  const lines = [];
  let failures = 0, checks = 0;
  function check(name, cond, detail) {
    checks++; if (!cond) failures++;
    lines.push('[' + (cond ? 'PASS' : 'FAIL') + '] ' + name + (detail ? '  ' + detail : ''));
    out.textContent = lines.join('\n');
  }

  // A flat-coloured "photo", or a two-tone one for the flip check.
  function swatch(top, bottom) {
    const c = document.createElement('canvas');
    c.width = 120; c.height = 160;             // portrait, like a phone still
    const g = c.getContext('2d');
    g.fillStyle = top; g.fillRect(0, 0, 120, bottom ? 80 : 160);
    if (bottom) { g.fillStyle = bottom; g.fillRect(0, 80, 120, 80); }
    return c;
  }

  const canvas = document.getElementById('gl');
  const W = 480, H = 640;

  const GUIDE = 78, SPAN = 0.84;
  const sphere = window.LSCCaptureSphere.create(canvas, {
    guideFovDeg: GUIDE, ndcSpan: SPAN, patchAspect: 160 / 120, patchFovDeg: 54
  });
  if (!sphere) {
    out.textContent = 'FAIL  WebGL unavailable — capture-sphere.js returned null';
    window.__done = true;
    return;
  }
  sphere.resize(W, H);

  /* Deliberately no peephole for most of the run: the mask is opaque and
     would tint every colour read back. It gets its own check at the end. */
  sphere.setPeephole(0, 0, 0);

  const RED = [255, 0, 0], GREEN = [0, 255, 0], BLUE = [0, 0, 255], YELLOW = [255, 255, 0];
  const POSES = [
    { name: 'ahead (yaw 0)', yaw: 0, pitch: 0, rgb: RED, css: '#ff0000' },
    { name: 'right (yaw 90)', yaw: 90, pitch: 0, rgb: GREEN, css: '#00ff00' },
    { name: 'behind (yaw 180)', yaw: 180, pitch: 0, rgb: BLUE, css: '#0000ff' },
    { name: 'up (pitch 60)', yaw: 0, pitch: 60, rgb: YELLOW, css: '#ffff00' }
  ];
  POSES.forEach(p => sphere.addPatch({
    yaw: p.yaw * DEG, pitch: p.pitch * DEG, roll: 0, canvas: swatch(p.css)
  }));

  const gl = canvas.getContext('webgl');
  function readAt(fx, fy) {
    // fx, fy in 0..1 from the TOP-LEFT; gl.readPixels is bottom-up.
    const x = Math.round(fx * (canvas.width - 1));
    const y = Math.round((1 - fy) * (canvas.height - 1));
    const px = new Uint8Array(4);
    gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    return [px[0], px[1], px[2], px[3]];
  }
  const near = (a, b, tol) => Math.abs(a[0] - b[0]) <= (tol || 40) &&
    Math.abs(a[1] - b[1]) <= (tol || 40) && Math.abs(a[2] - b[2]) <= (tol || 40);
  const show = c => '[' + c.join(',') + ']';

  // ---- 1. each patch appears where it was placed, and only there -------
  for (const p of POSES) {
    sphere.setPose(p.yaw * DEG, p.pitch * DEG, 0);
    sphere.render();
    const centre = readAt(0.5, 0.5);
    check('patch at ' + p.name + ' is on screen when we look at it',
      near(centre, p.rgb), show(centre) + ' expected ' + show(p.rgb));
  }

  // Looking 90 deg away from every patch centre and below the "up" patch:
  // yaw 270 is between "right" and "behind" by 90 deg each way, so with a
  // 68 deg photo in a 78 deg view nothing should reach the middle.
  sphere.setPose(270 * DEG, -20 * DEG, 0);
  sphere.render();
  {
    const c = readAt(0.5, 0.5);
    check('nothing leaks in from a direction with no patch',
      c[3] < 40, show(c) + ' (alpha ' + c[3] + ' — should be transparent)');
  }

  /* ---- 1b. several patches are on screen AT ONCE, and they overlap -----
     The point of the preview is watching the sphere fill in, so "each
     patch renders when you stare straight at it" is not enough: adjacent
     shots have to appear together in one frame, and they have to OVERLAP
     the way the capture pattern intends. A 68 deg photo centred 30 deg
     off axis -- the pattern's yaw step -- spans +3 to +57 deg, so it
     overlaps the patch at yaw 0 (which spans -27 to +27) between 3 and 27
     degrees and nowhere else. Reading three angles pins that down: 20 deg
     left is the first patch alone, 15 deg right is inside both (the later
     one wins), and 40 deg right is the second patch alone.

     A screen position for an angle: ndc = tan(angle) * ndcSpan /
     tan(guideFov/2), and fx = 0.5 + ndc/2. */
  const fxAt = a => 0.5 + (Math.tan(a * DEG) * SPAN / Math.tan(GUIDE / 2 * DEG)) / 2;
  const fyAt = a => 0.5 - (Math.tan(a * DEG) * SPAN / Math.tan(GUIDE / 2 * DEG)) / 2;
  sphere.addPatch({ yaw: 30 * DEG, pitch: 0, roll: 0, canvas: swatch('#ff00ff') });
  sphere.setPose(0, 0, 0);
  sphere.render();
  {
    const left = readAt(fxAt(-20), 0.5);
    const both = readAt(fxAt(15), 0.5);
    const right = readAt(fxAt(40), 0.5);
    check('adjacent patches render together and overlap as the pattern intends',
      near(left, RED) && near(both, [255, 0, 255]) && near(right, [255, 0, 255]),
      '-20 deg ' + show(left) + ', +15 deg ' + show(both) + ', +40 deg ' + show(right));
  }
  sphere.removePatch(sphere.patchCount - 1);

  /* ---- 1c. a patch is the SHAPE of its photograph ----------------------
     A portrait phone still is taller than it is wide, and the patch on
     the sphere has to be too. This shipped wrong once: a lens FOV quoted
     across the LONG axis was paired with a landscape 9:16 aspect, so
     every patch was drawn as a squat landscape rectangle and none of them
     lined up with the sphere they were supposedly stuck to. Measuring the
     patch's extent in degrees, horizontally and vertically, is what pins
     it down -- an aspect ratio alone would not, because the FOV could
     still be wrong on both axes together.

     The measured extent is SHORTER than the nominal field, and that is
     the edge feather doing its job, not an error: the outer EDGE_FEATHER
     of each patch fades out, so a colour probe stops seeing the patch a
     few degrees before its geometric edge. The bands below are therefore
     "somewhere between the half-power edge and the nominal one", which is
     still far tighter than the bug this exists to catch -- the landscape
     version of this patch measured about 30 deg wide and 17 tall, the
     wrong way round. */
  {
    sphere.setPose(0, 0, 0);
    sphere.render();
    // Scan out from the centre until the red patch stops covering.
    const edge = (probe) => {
      let last = 0;
      for (let a = 0; a <= 38; a += 0.5) if (probe(a)) last = a; else break;
      return last;
    };
    const isRed = c => near(c, RED, 60);
    const hEdge = edge(a => isRed(readAt(fxAt(a), 0.5)));
    const vEdge = edge(a => isRed(readAt(0.5, fyAt(a))));
    // 54 deg wide, 4:3 portrait -> 2*atan(tan(27)*4/3) = 68.0 deg tall,
    // so nominal half-extents are 27 and 34.
    check('a portrait photo makes a portrait patch, taller than it is wide',
      vEdge > hEdge * 1.15,
      'half-width ' + hEdge.toFixed(1) + ' deg, half-height ' + vEdge.toFixed(1) + ' deg');
    check('the patch matches the field of view of the photo on both axes',
      hEdge >= 20 && hEdge <= 27.5 && vEdge >= 25 && vEdge <= 34.5,
      'half-width ' + hEdge.toFixed(1) + ' (nominal 27), half-height ' +
      vEdge.toFixed(1) + ' (nominal 34)');

    // And it follows the frame when the real one turns out to be different.
    sphere.setPatchGeometry(40, 1);           // 40 deg square
    sphere.render();
    const hEdge2 = edge(a => isRed(readAt(fxAt(a), 0.5)));
    const vEdge2 = edge(a => isRed(readAt(0.5, fyAt(a))));
    check('setPatchGeometry rebuilds patches already on the sphere',
      Math.abs(hEdge2 - vEdge2) <= 1.5 && hEdge2 >= 14 && hEdge2 <= 20.5,
      'a 40 deg square frame gives ' + hEdge2.toFixed(1) + ' x ' + vEdge2.toFixed(1) +
      ' deg half-extents (nominal 20 x 20)');
    sphere.setPatchGeometry(54, 4 / 3);
    sphere.render();
  }

  // ---- 2. a patch behind the camera does not leak through -------------
  sphere.setPose(0, 0, 0);
  sphere.render();
  {
    // "behind (yaw 180)" is directly opposite. If the near-plane clip
    // failed, the perspective divide by a negative z would fold it into
    // view, usually mirrored through the centre.
    let sawBlue = false;
    for (let i = 0; i <= 10; i++) {
      for (let j = 0; j <= 10; j++) {
        const c = readAt(i / 10, j / 10);
        if (c[2] > 140 && c[0] < 90 && c[1] < 90) sawBlue = true;
      }
    }
    check('the patch behind the camera is clipped, not folded into view', !sawBlue);
  }

  // ---- 3. patches are not upside down ---------------------------------
  sphere.addPatch({
    yaw: 0, pitch: -60 * DEG, roll: 0, canvas: swatch('#ff0000', '#0000ff')
  });
  sphere.setPose(0, -60 * DEG, 0);
  sphere.render();
  {
    const top = readAt(0.5, 0.30), bottom = readAt(0.5, 0.70);
    check('the top of a photo renders at the top of its patch',
      near(top, RED) && near(bottom, BLUE),
      'top ' + show(top) + ', bottom ' + show(bottom) +
      ' (upside down would be blue over red)');
  }

  // ---- 4. removePatch actually removes it (this is Retake) ------------
  {
    sphere.setPose(90 * DEG, 0, 0);
    sphere.render();
    const before = readAt(0.5, 0.5);
    sphere.removePatch(1);                     // the green one
    sphere.render();
    const after = readAt(0.5, 0.5);
    check('removePatch clears the patch from the sphere',
      near(before, GREEN) && after[3] < 40,
      'before ' + show(before) + ', after ' + show(after));
  }

  // ---- 5. the mask dims the view and the peephole punches through -----
  {
    sphere.setPeephole(W / 2, H * 0.46, 60);
    sphere.setPose(180 * DEG, 0, 0);           // looking at the blue patch
    sphere.render();
    const inHole = readAt(0.5, 0.46);
    const outside = readAt(0.08, 0.06);
    check('the peephole shows the sphere, the mask covers the rest',
      near(inHole, BLUE) && outside[3] > 200 && outside[0] < 80,
      'hole ' + show(inHole) + ', masked ' + show(outside));
  }

  sphere.destroy();
  lines.push('');
  lines.push(failures === 0 ? 'ALL ' + checks + ' CHECKS PASSED'
    : failures + ' OF ' + checks + ' CHECKS FAILED');
  out.textContent = lines.join('\n');
  window.__result = { checks: checks, failures: failures, text: lines.join('\n') };
  window.__done = true;
})();
</script>
</body></html>
